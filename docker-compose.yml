services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: data-mapper-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Dev_Only_Password1
    ports:
      - "127.0.0.1:14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ./database/create-entity.sql:/create-entity.sql:ro
    entrypoint:
      [
        "/opt/mssql-tools18/bin/sqlcmd",
        "-C",
        "-S",
        "sqlserver",
        "-U",
        "sa",
        "-P",
        "Dev_Only_Password1",
        "-b",
        "-v",
        "DatabaseName=Development",
        "-i",
        "/create-entity.sql",
      ]
    restart: "no"

volumes:
  sqlserver-data:
